<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Photobox</title>
        <style>
            *{
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            }

            body {
                background-color: #f5f5f5;
                color: #333;
                min-height: 100vh;
            }

            .container {
                max-width: 1000px;
                margin: 0 auto;
                padding: 20px;
            }

            header {
                text-align: center;
                margin-bottom: 30px;
                padding: 20px;
                background: linear-gradient(135deg, #ff1a1a, #ffb625);
                color: white;
                border-radius: 10px;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            }

            h1 {
                font-size: 2.5rem;
                margin-bottom: 10px;
            }

            .description {
                font-size: 1.1rem;
                opacity: 0.9;
            }

            .main-content {
                display: flex;
                flex-direction: column;
                gap: 30px;
            }

            .camera-section {
                background-color: white;
                border-radius: 10px;
                padding: 20px;
                box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            }

            .viewfinder {
                position: relative;
                width: 100%;
                max-width: 640px;
                margin: 0 auto;
                border-radius: 8px;
                overflow: hidden;
                box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            }

            #video {
                width: 100%;
                display: block;
                transform: scaleX(-1);
            }

            .viewfinder-overlay {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                pointer-events: none;
                background: linear-gradient(135deg, rgba(110,142,251,0.1) 0%, rgba(167,119,227,0.1) 100%);
            }

            .camera-controls {
                display: flex;
                justify-content: center;
                gap: 20px;
                margin-top: 20px;
            }

            button {
                padding: 12px 24px;
                border: none;
                border-radius: 50px;
                font-size: 1rem;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.3s ease;
                display: flex;
                align-items: center;
                gap: 8px;
            }

            .btn-primary {
                background-color: #ffb625;
                color: white;
            }

            .btn-primary:hover {
                background-color: #ff1a1a;
                transform: translateY(-2px);
            }

            .btn-secondary {
                background-color: #f1f1f1;
                color: #333;
            }

            .btn-secondary:hover {
                background-color: #e5e5e5;
            }

            .btn-capture {
                width: 60px;
                height: 60px;
                border-radius: 50%;
                background-color: white;
                border: 4px solid #6e8efb;
                position: relative;
                margin: 20px auto;
            }

            .btn-capture::before {
                content: '';
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                width: 40px;
                height: 40px;
                border-radius: 50%;
                background-color: #ffb625;
            }

            .btn-capture:hover::before {
                background-color: #ff1a1a;
            }

            .gallery-section {
                background-color: white;
                border-radius: 10px;
                padding: 20px;
                box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            }

            .gallery-title {
                margin-bottom: 20px;
                text-align: center;
                font-size: 1.5rem;
                color: #333;
            }

            .photos-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 15px;
            }

            .photo-item {
                position: relative;
                border-radius: 8px;
                overflow: hidden;
                box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
                transition: transform 0.3s ease;
                aspect-ratio: 1;
            }

            .photo-item:hover {
                transform: scale(1.03);
            }

            .photo-item img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            .overlay {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.5);
                display: flex;
                justify-content: center;
                align-items: center;
                opacity: 0;
                transition: opacity 0.3s ease;
            }

            .photo-item:hover .overlay {
                opacity: 1;
            }

            .delete-btn {
                background-color: #ff4757;
                color: white;
                padding: 8px 15px;
                border-radius: 20px;
                border: none;
                cursor: pointer;
            }

            .footer {
                text-align: center;
                margin-top: 40px;
                padding: 20px;
                color: #777;
            }

            @media (max-width: 768px) {
                .photos-grid {
                    grid-template-columns: repeat(2, 1fr);
                }

                .btn-capture {
                    width: 50px;
                    height: 50px;
                }

                .btn-capture::before {
                    width: 30px;
                    height: 30px;
                }
            }

            @media (max-width: 480px) {
                .photos-grid {
                    grid-template-columns: 1fr;
                }

                h1 {
                    font-size: 2rem;
                }
            }

            /* Preview modal styles */
            .modal {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-color: rgba(0, 0, 0, 0.8);
                z-index: 1000;
                justify-content: center;
                align-items: center;
            }

            .modal-content {
                position: relative;
                max-width: 90%;
                max-height: 90%;
            }

            .modal-content img {
                max-width: 100%;
                max-height: 90vh;
                border-radius: 8px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            }

            .modal-controls {
                position: absolute;
                bottom: -60px;
                left: 50%;
                transform: translateX(-50%);
                display: flex;
                gap: 15px;
            }

            .close-modal {
                position: absolute;
                top: 15px;
                right: 15px;
                background-color: rgba(0, 0, 0, 0.6);
                color: white;
                width: 40px;
                height: 40px;
                border-radius: 50%;
                display: flex;
                justify-content: center;
                align-items: center;
                cursor: pointer;
                font-size: 1.3rem;
            }

            .status-message {
                text-align: center;
                margin: 20px 0;
                padding: 10px;
                border-radius: 5px;
            }

            .success {
                background-color: rgba(46, 213, 115, 0.2);
                color: #2ed573;
            }

            .error {
                background-color: rgba(255, 71, 87, 0.2);
                color: #ff4757;
            }
        </style>
    </head>

    <body>
        <div class="container">
            <header>
                <h1>Cliche Photobox</h1>
                <p class="description">Capture, preview, and manage your memories</p>
            </header>

            <div class="main-content">
                <section class="camera-section">
                    <h2>Take a Photo</h2>
                    <div id="status-message" class="status-message" style="display: none;"></div>
                    
                    <div class="viewfinder">
                        <video id="video" autoplay playsinline></video>
                        <div class="viewfinder-overlay"></div>
                        <canvas id="canvas" style="display: none;"></canvas>
                    </div>

                    <div class="camera-controls">
                        <button id="start-camera" class="btn-primary">
                            <span>Start Camera</span>
                        </button>
                        <button id="stop-camera" class="btn-secondary" disabled>
                            <span>Stop Camera</span>
                        </button>
                        <button id="switch-camera" class="btn-secondary" style="display: none;" disabled>
                            <span>Switch Camera</span>
                        </button>
                    </div>

                    <button id="capture-btn" class="btn-capture" disabled></button>

                    <div id="preview-controls" style="display: none; text-align: center;">
                        <button id="save-photo" class="btn-primary">
                            <span>Save Photo</span>
                        </button>
                        <button id="retake-photo" class="btn-secondary" style="margin-left: 10px;">
                            <span>Retake</span>
                        </button>
                    </div>

                    <div id="photo-preview" style="display: none; text-align: center; margin-top: 20px;">
                        <img id="preview-image" src="" alt="Captured photo preview" style="max-width: 100%; border-radius: 8px;">
                    </div>
                </section>

                <section class="gallery-section">
                    <h2 class="gallery-title">My Photos</h2>
                    <div id="no-photos" style="text-align: center; padding: 40px;">
                        <p>No photos yet. Capture some memories!</p>
                    </div>
                    <div id="photos-container" class="photos-grid"></div>
                </section>
            </div>

            <div class="footer">
                <p>PhotoBox © 2023 | All your memories in one place</p>
            </div>
        </div>

        <!-- Preview Modal -->
        <div id="preview-modal" class="modal">
            <div class="modal-content">
                <span class="close-modal">&times;</span>
                <img id="modal-image" src="" alt="Preview of selected photo">
                <div class="modal-controls">
                    <button id="download-photo" class="btn-primary">Download</button>
                    <button id="delete-photo" class="btn-secondary">Delete</button>
                </div>
            </div>
        </div>

        <script>
            document.addEventListener('DOMContentLoaded', function() {
                // DOM Elements
                const video = document.getElementById('video');
                const canvas = document.getElementById('canvas');
                const startCameraBtn = document.getElementById('start-camera');
                const stopCameraBtn = document.getElementById('stop-camera');
                const switchCameraBtn = document.getElementById('switch-camera');
                const captureBtn = document.getElementById('capture-btn');
                const savePhotoBtn = document.getElementById('save-photo');
                const retakePhotoBtn = document.getElementById('retake-photo');
                const previewImage = document.getElementById('preview-image');
                const photoPreview = document.getElementById('photo-preview');
                const previewControls = document.getElementById('preview-controls');
                const photosContainer = document.getElementById('photos-container');
                const noPhotosMessage = document.getElementById('no-photos');
                const previewModal = document.getElementById('preview-modal');
                const modalImage = document.getElementById('modal-image');
                const closeModalBtn = document.querySelector('.close-modal');
                const downloadPhotoBtn = document.getElementById('download-photo');
                const deletePhotoBtn = document.getElementById('delete-photo');
                const statusMessage = document.getElementById('status-message');

                // Variables
                let stream = null;
                let capturedPhoto = null;
                let currentFacingMode = 'user'; // front camera by default
                let photos = JSON.parse(localStorage.getItem('photobox-photos')) || [];
                let currentPhotoIndex = null;

                // Initialize
                updateGallery();

                // Event Listeners
                startCameraBtn.addEventListener('click', startCamera);
                stopCameraBtn.addEventListener('click', stopCamera);
                switchCameraBtn.addEventListener('click', switchCamera);
                captureBtn.addEventListener('click', capturePhoto);
                savePhotoBtn.addEventListener('click', savePhoto);
                retakePhotoBtn.addEventListener('click', retakePhoto);
                closeModalBtn.addEventListener('click', closeModal);
                downloadPhotoBtn.addEventListener('click', downloadPhoto);
                deletePhotoBtn.addEventListener('click', deletePhoto);

                // Functions
                function showStatus(message, type) {
                    statusMessage.textContent = message;
                    statusMessage.className = `status-message ${type}`;
                    statusMessage.style.display = 'block';
                    
                    setTimeout(() => {
                        statusMessage.style.display = 'none';
                    }, 5000);
                }

                async function startCamera() {
                    try {
                        const constraints = {
                            video: {
                                facingMode: currentFacingMode,
                                width: { ideal: 1280 },
                                height: { ideal: 720 }
                            }
                        };

                        stream = await navigator.mediaDevices.getUserMedia(constraints);
                        video.srcObject = stream;
                        
                        startCameraBtn.disabled = true;
                        stopCameraBtn.disabled = false;
                        switchCameraBtn.disabled = false;
                        captureBtn.disabled = false;
                        switchCameraBtn.style.display = 'inline-flex';
                        
                        showStatus('Camera started successfully', 'success');
                    } catch (error) {
                        console.error('Error starting camera:', error);
                        showStatus(`Error: ${error.message}`, 'error');
                    }
                }

                function stopCamera() {
                    if (stream) {
                        stream.getTracks().forEach(track => track.stop());
                        video.srcObject = null;
                        
                        startCameraBtn.disabled = false;
                        stopCameraBtn.disabled = true;
                        switchCameraBtn.disabled = true;
                        captureBtn.disabled = true;
                        
                        showStatus('Camera stopped', 'success');
                    }
                }

                async function switchCamera() {
                    if (!stream) return;
                    
                    // Store the current stream to stop it later
                    const oldStream = stream;
                    
                    // Toggle facing mode
                    currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
                    
                    try {
                        const constraints = {
                            video: {
                                facingMode: currentFacingMode,
                                width: { ideal: 1280 },
                                height: { ideal: 720 }
                            }
                        };
                        
                        stream = await navigator.mediaDevices.getUserMedia(constraints);
                        video.srcObject = stream;
                        
                        // Stop the old stream
                        oldStream.getTracks().forEach(track => track.stop());
                        
                        showStatus(`Switched to ${currentFacingMode === 'user' ? 'front' : 'rear'} camera`, 'success');
                    } catch (error) {
                        console.error('Error switching camera:', error);
                        showStatus(`Error switching camera: ${error.message}`, 'error');
                        // Revert facing mode if switch fails
                        currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
                    }
                }

                function capturePhoto() {
                    if (!stream) return;
                    
                    const context = canvas.getContext('2d');
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    
                    // Draw the current video frame to the canvas
                    context.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    // Get the image data from canvas
                    capturedPhoto = canvas.toDataURL('image/png');
                    
                    // Show preview
                    previewImage.src = capturedPhoto;
                    photoPreview.style.display = 'block';
                    previewControls.style.display = 'block';
                    
                    // Hide capture button
                    captureBtn.disabled = true;
                    
                    showStatus('Photo captured! Review or retake', 'success');
                }

                function savePhoto() {
                    if (!capturedPhoto) return;
                    
                    const timestamp = new Date().toISOString();
                    const photoData = {
                        id: Date.now(),
                        data: capturedPhoto,
                        timestamp: timestamp
                    };
                    
                    photos.unshift(photoData);
                    localStorage.setItem('photobox-photos', JSON.stringify(photos));
                    
                    // Reset UI
                    photoPreview.style.display = 'none';
                    previewControls.style.display = 'none';
                    captureBtn.disabled = false;
                    capturedPhoto = null;
                    
                    updateGallery();
                    showStatus('Photo saved to gallery!', 'success');
                }

                function retakePhoto() {
                    photoPreview.style.display = 'none';
                    previewControls.style.display = 'none';
                    captureBtn.disabled = false;
                    capturedPhoto = null;
                    showStatus('Ready to capture another photo', 'success');
                }

                function updateGallery() {
                    if (photos.length === 0) {
                        noPhotosMessage.style.display = 'block';
                        photosContainer.style.display = 'none';
                        return;
                    }
                    
                    noPhotosMessage.style.display = 'none';
                    photosContainer.style.display = 'grid';
                    photosContainer.innerHTML = '';
                    
                    photos.forEach((photo, index) => {
                        const photoItem = document.createElement('div');
                        photoItem.className = 'photo-item';
                        photoItem.dataset.index = index;
                        
                        const img = document.createElement('img');
                        img.src = photo.data;
                        img.alt = `Photo taken on ${new Date(photo.timestamp).toLocaleString()}`;
                        
                        const overlay = document.createElement('div');
                        overlay.className = 'overlay';
                        
                        const viewBtn = document.createElement('button');
                        viewBtn.className = 'delete-btn';
                        viewBtn.textContent = 'View';
                        viewBtn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            openModal(index);
                        });
                        
                        overlay.appendChild(viewBtn);
                        photoItem.appendChild(img);
                        photoItem.appendChild(overlay);
                        photosContainer.appendChild(photoItem);
                    });
                }

                function openModal(index) {
                    currentPhotoIndex = index;
                    const photo = photos[index];
                    modalImage.src = photo.data;
                    modalImage.alt = `Photo taken on ${new Date(photo.timestamp).toLocaleString()}`;
                    previewModal.style.display = 'flex';
                }

                function closeModal() {
                    previewModal.style.display = 'none';
                    currentPhotoIndex = null;
                }

                function downloadPhoto() {
                    if (currentPhotoIndex === null) return;
                    
                    const photo = photos[currentPhotoIndex];
                    const link = document.createElement('a');
                    link.href = photo.data;
                    link.download = `photobox-${new Date(photo.timestamp).toISOString().split('T')[0]}.png`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    
                    showStatus('Photo download started', 'success');
                }

                function deletePhoto() {
                    if (currentPhotoIndex === null) return;
                    
                    photos.splice(currentPhotoIndex, 1);
                    localStorage.setItem('photobox-photos', JSON.stringify(photos));
                    updateGallery();
                    closeModal();
                    
                    showStatus('Photo deleted', 'success');
                }

                // Close modal when clicking outside the image
                previewModal.addEventListener('click', (e) => {
                    if (e.target === previewModal) {
                        closeModal();
                    }
                });
            });
        </script>
    </body>
</html>
